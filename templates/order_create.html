{% extends 'base.html' %}{% block content %}<h1>สร้างออเดอร์</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><div class="card"><label>โต๊ะ</label><select name="table_id" required>{% for t in tables %}<option value="{{t.id}}" {% if t.status=='ว่าง' %}{% else %}disabled{% endif %}>โต๊ะ {{t.id}} - {{t.status}}</option>{% endfor %}</select><label>ชื่อลูกค้า</label><input name="customer" value="{{user.username if user.role=='customer' else ''}}" placeholder="ชื่อลูกค้า"></div><div class="grid">{% for item in menu %}<div class="card"><h3>{{item.name}}</h3><p>{{item.category}} · {{item.price}} ฿ · {{item.status}}</p>{% if item.status!='หมด' %}<label>จำนวน</label><input class="qty" type="number" min="0" value="0" name="quantity_{{item.id}}">{% else %}<span class="pill">หมด</span>{% endif %}</div>{% endfor %}</div><button class="btn green">บันทึกออเดอร์</button></form>{% endblock %}
