{% extends 'base.html' %}{% block content %}<h1>{{title}}</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<div class="card"><form method="post"><label>ชื่อเมนู</label><input name="name" value="{{item.name if item else ''}}" required><label>หมวดหมู่</label><input name="category" value="{{item.category if item else ''}}" required><label>ราคา</label><input type="number" step="0.01" min="0.01" name="price" value="{{item.price if item else ''}}" required><label>Image URL</label><input name="image" value="{{item.image if item else ''}}"><label>สถานะ</label><select name="status"><option {% if not item or item.status=='พร้อมขาย' %}selected{% endif %}>พร้อมขาย</option><option {% if item and item.status=='หมด' %}selected{% endif %}>หมด</option></select><button class="btn">บันทึก</button> <a class="btn gray" href="{{url_for('menu')}}">ยกเลิก</a></form></div>{% endblock %}
