<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login</title><style>body{font-family:Arial;background:#f3f4f6}.login{max-width:400px;margin:90px auto;background:white;padding:28px;border-radius:15px;box-shadow:0 5px 20px #0001}input,button{width:100%;padding:11px;margin:7px 0;border-radius:8px;border:1px solid #ddd}button{background:#2563eb;color:white;border:0;cursor:pointer}.error{background:#fee2e2;padding:10px;border-radius:8px}.hint{background:#f3f4f6;padding:10px;border-radius:8px;font-size:14px}</style></head><body><div class="login"><h1>🍽️ Login</h1>{% if error %}<div class="error">{{error}}</div>{% endif %}<form method="post"><label>Username</label><input name="username" required><label>Password</label><input type="password" name="password" required><button>เข้าสู่ระบบ</button></form><div class="hint">ทดลองใช้: admin / 1234, staff / 1234, customer / 1234</div></div></body></html>
