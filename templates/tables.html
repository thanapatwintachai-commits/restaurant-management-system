{% extends 'base.html' %}{% block content %}<h1>โต๊ะ</h1><div class="grid">{% for t in tables %}<div class="card"><h2>โต๊ะ {{t.id}}</h2><p>สถานะ: <b>{{t.status}}</b></p><p>ลูกค้า: {{t.customer or '-'}}</p>{% if t.status=='มีลูกค้า' and user.role in ['admin','staff'] %}<a class="btn" href="{{url_for('bill',table_id=t.id)}}">ดูบิล</a>{% endif %}</div>{% endfor %}</div>{% endblock %}
